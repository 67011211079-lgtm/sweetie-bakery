<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>คำสั่งซื้อของฉัน</title><style>body{font-family:Arial,Tahoma;background:#fff8fb;color:#432b35;margin:0}.wrap{max-width:900px;margin:30px auto;padding:16px}table{width:100%;border-collapse:collapse;background:white}th,td{padding:12px;border-bottom:1px solid #eedde5;text-align:left}a{color:#a52b66}.box{background:white;border-radius:12px;padding:16px;overflow:auto}</style></head><body><main class="wrap"><h1>📦 คำสั่งซื้อของฉัน</h1><p><a href="/">← กลับหน้าร้าน</a></p><div class="box"><table><tr><th>เลขที่</th><th>ผู้รับ</th><th>ที่อยู่</th><th>สถานะ</th><th>ยอดรวม</th><th>วันที่</th></tr>{{range .Orders}}<tr><td>#{{.ID}}</td><td>{{.Customer}}<br>{{.Phone}}</td><td>{{.Address}}</td><td>{{.Status}}</td><td>฿{{printf "%.2f" .Total}}</td><td>{{.Created}}</td></tr>{{else}}<tr><td colspan="6">ยังไม่มีคำสั่งซื้อ</td></tr>{{end}}</table></div></main></body></html>
